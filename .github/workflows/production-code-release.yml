name: Production code-only release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_CREDX_CODE_ONLY
        required: true
      expected_base:
        description: Expected origin/main commit for this release branch
        required: true

permissions:
  contents: read

concurrency:
  group: credx-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CREDX_DATABASE_ENVIRONMENT: production
      CREDX_PRODUCTION_CHANGE_APPROVAL: APPROVED
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Require exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DEPLOY_CREDX_CODE_ONLY"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is based on the expected main commit
        env:
          EXPECTED_BASE: ${{ inputs.expected_base }}
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

      - name: Reject schema and migration changes
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(schema\.prisma|prisma/migrations/)' ; then
            echo "Schema or migration files require the full production-release workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy API first
        run: railway up --ci --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment production --service "@credx/api" --message "GitHub approved code-only API release $GITHUB_SHA"

      - name: Verify API
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 10 "${{ vars.CREDX_API_URL }}/health"

      - name: Deploy web second
        run: railway up --ci --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment production --service "@credx/web" --message "GitHub approved code-only web release $GITHUB_SHA"

      - name: Verify web
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 10 "${{ vars.CREDX_WEB_URL }}/"
